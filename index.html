<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pixel Art Image Tool</title>
    <link rel="stylesheet" href="styles.css">
    <script src="image-processing.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="toolbar">
        <button id="open-button" type="button">Open</button>
        <button id="export-button" type="button" class="primary" disabled>Export PNG</button>
        <button id="reset-button" type="button" disabled>Reset</button>
        <input id="file-input" type="file" accept="image/png,image/jpeg" hidden>
    </header>

    <main class="workspace">
        <section id="preview-area" class="preview-area" aria-label="Preview">
            <div class="preview-stage">
                <canvas id="preview-canvas"></canvas>
            </div>
            <p class="empty-hint">Open or drop a PNG or JPEG image</p>
        </section>

        <aside class="panel">
            <section class="panel-group">
                <h2>Zoom</h2>
                <div class="segmented" role="group" aria-label="Zoom">
                    <button type="button" data-zoom="1" disabled>100%</button>
                    <button type="button" data-zoom="2" disabled>200%</button>
                    <button type="button" data-zoom="4" disabled>400%</button>
                    <button type="button" data-zoom="8" disabled>800%</button>
                </div>
            </section>

            <section class="panel-group">
                <h2>Background</h2>
                <label class="check">
                    <input id="bg-enabled" type="checkbox" disabled>
                    Remove background
                </label>
                <fieldset id="bg-options" class="options" disabled>
                    <div class="color-row">
                        <input id="bg-color" type="color" value="#ffffff" aria-label="Background color">
                        <output id="bg-color-value" for="bg-color">#FFFFFF</output>
                        <button id="bg-pick-button" type="button" aria-pressed="false"
                                title="Pick color from image (Esc to cancel)">Pick</button>
                    </div>
                    <label class="field">
                        <span class="field-label">
                            Tolerance <output id="bg-tolerance-value" for="bg-tolerance">0</output>
                        </span>
                        <input id="bg-tolerance" type="range" min="0" max="255" step="1" value="0">
                    </label>
                    <div class="radio-list" role="radiogroup" aria-label="Mode">
                        <label><input type="radio" name="bg-mode" value="all"> All matching pixels</label>
                        <label><input type="radio" name="bg-mode" value="connected" checked> Connected background</label>
                    </div>
                </fieldset>
            </section>

            <section class="panel-group">
                <h2>Transform</h2>
                <div class="button-grid" role="group" aria-label="Transform">
                    <button type="button" data-transform="rotate-left" disabled
                            title="Rotate left 90°" aria-label="Rotate left 90°">↺ 90°</button>
                    <button type="button" data-transform="rotate-right" disabled
                            title="Rotate right 90°" aria-label="Rotate right 90°">↻ 90°</button>
                    <button type="button" data-transform="flip-x" disabled
                            title="Flip horizontal" aria-label="Flip horizontal">Flip H</button>
                    <button type="button" data-transform="flip-y" disabled
                            title="Flip vertical" aria-label="Flip vertical">Flip V</button>
                </div>
            </section>

            <section class="panel-group">
                <h2>Resize</h2>
                <fieldset id="resize-options" class="options" disabled>
                    <div class="segmented segmented-2" role="group" aria-label="Resize method">
                        <button type="button" data-resize-method="nearest">Nearest</button>
                        <button type="button" data-resize-method="area">Area</button>
                    </div>
                    <p id="resize-note" class="hint"></p>
                    <div class="size-row">
                        <label class="field">
                            <span class="field-label">Width, px</span>
                            <input id="resize-width" type="number" min="1" step="1" inputmode="numeric" aria-describedby="resize-error">
                        </label>
                        <label class="field">
                            <span class="field-label">Height, px</span>
                            <input id="resize-height" type="number" min="1" step="1" inputmode="numeric" aria-describedby="resize-error">
                        </label>
                    </div>
                    <p id="resize-error" class="field-error" role="alert"></p>
                    <label class="check">
                        <input id="resize-keep-ratio" type="checkbox" checked>
                        Preserve aspect ratio
                    </label>
                </fieldset>
            </section>

            <section class="panel-group">
                <h2>Crop</h2>
                <label class="check">
                    <input id="crop-enabled" type="checkbox" disabled>
                    Crop image
                </label>
                <fieldset id="crop-options" class="options" disabled>
                    <div class="radio-list" role="radiogroup" aria-label="Crop mode">
                        <label><input type="radio" name="crop-mode" value="content" checked> Content</label>
                        <label><input type="radio" name="crop-mode" value="margin"> Content + margin</label>
                        <label><input type="radio" name="crop-mode" value="fixed"> Fixed size</label>
                    </div>
                    <label id="crop-margin-field" class="field" hidden>
                        <span class="field-label">Margin, px</span>
                        <input id="crop-margin" type="number" min="0" step="1" inputmode="numeric" aria-describedby="crop-error">
                    </label>
                    <div id="crop-fixed-fields" class="crop-fixed" hidden>
                        <div class="size-row">
                            <label class="field">
                                <span class="field-label">Width, px</span>
                                <input id="crop-width" type="number" min="1" step="1" inputmode="numeric" aria-describedby="crop-error">
                            </label>
                            <label class="field">
                                <span class="field-label">Height, px</span>
                                <input id="crop-height" type="number" min="1" step="1" inputmode="numeric" aria-describedby="crop-error">
                            </label>
                        </div>
                        <div class="field">
                            <span class="field-label">Anchor</span>
                            <div class="anchor-grid" role="group" aria-label="Anchor">
                                <button type="button" data-anchor="top-left" aria-label="Top left" title="Top left">↖</button>
                                <button type="button" data-anchor="top" aria-label="Top" title="Top">↑</button>
                                <button type="button" data-anchor="top-right" aria-label="Top right" title="Top right">↗</button>
                                <button type="button" data-anchor="left" aria-label="Left" title="Left">←</button>
                                <button type="button" data-anchor="center" aria-label="Center" title="Center">•</button>
                                <button type="button" data-anchor="right" aria-label="Right" title="Right">→</button>
                                <button type="button" data-anchor="bottom-left" aria-label="Bottom left" title="Bottom left">↙</button>
                                <button type="button" data-anchor="bottom" aria-label="Bottom" title="Bottom">↓</button>
                                <button type="button" data-anchor="bottom-right" aria-label="Bottom right" title="Bottom right">↘</button>
                            </div>
                        </div>
                    </div>
                    <p id="crop-note" class="hint"></p>
                    <p id="crop-error" class="field-error" role="alert"></p>
                </fieldset>
            </section>

            <section class="panel-group">
                <h2>Image</h2>
                <dl class="info">
                    <dt>File</dt>
                    <dd id="file-name-value">—</dd>
                    <dt>Size</dt>
                    <dd id="size-value">—</dd>
                </dl>
            </section>

            <p id="status" class="status" role="status" aria-live="polite"></p>
        </aside>
    </main>
</body>
</html>
